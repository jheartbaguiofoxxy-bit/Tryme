<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        /* Animation all */
         @keyframes fadeIn {
         from { opacity: 0; }
         to { opacity: 1; }
         }
         
        /*fadeIn for all buttons*/
.main-nav, .hero, .about-creator, .works, .content1, .LOGO {
  animation: fadeIn 1s ease-in-out;
}

       /*'float' animation for all buttons */
@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0); }
}

     /*hero button*/
        .hero button {
        animation: float 3s ease-in-out infinite;
}

     /*works items */
        @keyframes scaleUp {
        from { transform: scale(0.8); }
        to { transform: scale(1); }
}

     .works-item {
      animation: scaleUp 0.5s ease-in-out;
      animation-delay: 0.3s; /* Delay to stagger the animations */
}

/* Ensure animations only play once when the page loads */
.main-nav, .hero, .works, .content1 {
  animation-fill-mode: forwards;
}

  
 
        body { 
            background-image: linear-gradient(to bottom right, #3b4675,#070b50,#000);
            background-attachment:fixed;
            background-repeat: no-repeat;
        }
        
        div { 
            background-color: transparent;
            padding: 3px;
            margin-left: 30px;
            margin-right: 30px;
        }                
        nav {      
            display: flex;
            justify-content: space-between;                        
            background-color: transparent;            
        }
        nav button{
            background-image: linear-gradient(to bottom left, #0016e5,#1a1641,#000);
            background-attachment:fixed;
            background-repeat: no-repeat;
            padding: 5px;
            font-family: courier;    
            color: #e5c626;        
            font-size: 10px;           
            border: #e5c626 solid 1px;
            border-radius: 25px;           
        }
        header {
            text-align: center;
        }
        header img {
            width: 150px;
            height; 40px;                     
        }
        section {
            background-color: #fff;
            border: none;
            border-radius: 25px;
            margin: 30px;
            padding: 10px;
            max-height: 100%;
            text-align: center;                                                             
        }                                   
        section p { 
            font-family: fantasy;          
            color: #4f468bde;
        }
        section q {
            font-family: cursive; 
            color: #796bd585;
        }
        section button{
            background-color: transparent;
            padding: 5px;
            font-family: courier;    
            color: #342b81de;        
            font-size: 10px;           
            border: #342b81de solid 1px;
            border-radius: 25px;    
        }        
    </style>
</head>
<body>
    <header>

        <div class="main-nav">
        <nav>
            
                <a href="homepage.htm"><button>HOME</button></a>
                <a href="Portfolio.htm"><button>PORTFOLIO</button></a>

        </nav>
        </div>

    <section class="content1">

            height: 100px;

        <q>Don't dwell on the past, as it will pull you away from your hopes and dreams.</q>

        <img src="blue1.jpg" alt="hero" style="width:200px;height:150px;padding:0px;border-radius:20px;"> <br> <br>

    </section>

</html>
